name: 全平台编译（已签名 Release APK）

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  ###########################################################################
  # 1️⃣ 代码分析
  ###########################################################################
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # 排盘引擎单元测试（六爻/梅花/八字）
      - run: flutter test

  ###########################################################################
  # 2️⃣ Android APK（Debug + 已签名 Release）
  ###########################################################################
  android:
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get

      # 导入签名密钥（需先在 GitHub 配置 KEYSTORE_BASE64 等 Secrets）
      # 若未配置则输出警告，build.gradle 自动回退 debug 签名
      - name: 🔑 导入签名密钥
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/qiankunyi-release-key.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=qiankunyi-release-key.jks" >> android/key.properties
            echo "✅ 签名密钥已导入，将构建已签名 APK"
          else
            echo "⚠️ 未配置签名密钥，将使用 Debug 签名"
          fi

      # Release APK（已签名）
      - name: 🏗️ 构建 Release APK
        run: flutter build apk --release --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Debug APK（未签名，备用，非必过）
      - name: 🏗️ 构建 Debug APK
        continue-on-error: true
        run: flutter build apk --debug --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ###########################################################################
  # 3️⃣ Linux 桌面
  ###########################################################################
  linux:
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: 🏗️ 构建 Linux 桌面版
        run: flutter build linux --release --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle/
          if-no-files-found: warn

  ###########################################################################
  # 4️⃣ Windows 桌面
  ###########################################################################
  windows:
    needs: [analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: 🏗️ 构建 Windows 桌面版（Release）
        run: flutter build windows --release --build-number=${{ env.BUILD_NUMBER }}
      - name: 📦 打包 VC++ 运行时 DLL
        shell: pwsh
        run: |
          $vcRedistDir = "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT"
          if (Test-Path $vcRedistDir) {
            Copy-Item "$vcRedistDir\*.dll" "build\windows\x64\runner\Release\" -Force
            Write-Host "已复制 VC++ 运行时 DLL"
          } else {
            Write-Host "未找到 VC++ 运行时目录，跳过"
          }
          Write-Host "=== 输出目录文件列表 ==="
          Get-ChildItem "build\windows\x64\runner\Release\" | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build\windows\x64\runner\Release\
          if-no-files-found: warn

  ###########################################################################
  # 5️⃣ iOS（不签名，仅模拟器）
  ###########################################################################
  ios:
    needs: [analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: 🏗️ 构建 iOS 版（模拟器）
        run: flutter build ios --debug --no-codesign --simulator --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug
          path: build/ios/Debug-iphonesimulator/
          if-no-files-found: warn

  ###########################################################################
  # 6️⃣ macOS 桌面
  ###########################################################################
  macos:
    needs: [analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: 🏗️ 构建 macOS 桌面版
        run: flutter build macos --release --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/
          if-no-files-found: warn

  ###########################################################################
  # 7️⃣ GitHub Release（仅 push 到 main 时发布 beta 版本）
  ###########################################################################
  release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [android, windows, linux, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成版本标签
        id: tag
        run: |
          echo "tag=beta-v${{ env.BUILD_NUMBER }}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release/

      # Debug APK 为容忍构建（continue-on-error，JetifyTransform 可能失败），
      # 未上传 artifact 时无缝跳过，避免 release 因此中断
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-debug-apk
          path: release/

      - name: 打包桌面端产物
        run: |
          mkdir -p release/desktop
          # 下载并打包 Windows
          gh run download ${{ github.run_id }} -n windows-release -D /tmp/win
          cd /tmp/win && zip -r ${{ github.workspace }}/release/desktop/windows-release.zip . && cd -
          # 下载并打包 Linux
          gh run download ${{ github.run_id }} -n linux-release -D /tmp/linux
          cd /tmp/linux && zip -r ${{ github.workspace }}/release/desktop/linux-release.zip . && cd -
          # 下载并打包 macOS
          gh run download ${{ github.run_id }} -n macos-release -D /tmp/macos
          cd /tmp/macos && zip -r ${{ github.workspace }}/release/desktop/macos-release.zip . && cd -
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 构建 Release 日志
        run: |
          cat > /tmp/release_body.md << 'RELEASENOTES'
          ## 落·乾坤 Beta 版本

          构建编号: ${{ env.BUILD_NUMBER }}
          提交: ${{ github.sha }}
          日期: $(date '+%Y-%m-%d %H:%M')

          ### 📦 包含的构建产物
          - 📱 Android Release APK（已签名）
          - 🪟 Windows 桌面版
          - 🐧 Linux 桌面版
          - 🍎 macOS 桌面版
          - 📲 iOS Debug（模拟器）

          ### ⚠️ 注意事项
          - 这是测试版本，可能存在不稳定因素
          - Android APK 已使用自签名证书签名
          - 桌面版为 ZIP 压缩包，解压即可运行
          RELEASENOTES

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ env.BUILD_NUMBER }}
          name: "Beta v${{ env.BUILD_NUMBER }}"
          body_path: /tmp/release_body.md
          prerelease: true
          files: |
            release/*.apk
            release/desktop/*.zip
          fail_on_unmatched_files: false

name: 全平台编译（已签名 Release APK）

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  ###########################################################################
  # 1️⃣ 代码分析
  ###########################################################################
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  ###########################################################################
  # 2️⃣ Android APK（Debug + 已签名 Release）
  ###########################################################################
  android:
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get

      # 准备签名密钥（当 GitHub Secrets 配置后自动生效）
      - name: 🔑 导入签名密钥
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/qiankunyi-release-key.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=qiankunyi-release-key.jks" >> android/key.properties
          echo "✅ 签名密钥已导入"

      # Release APK（已签名）
      - name: 🏗️ 构建 Release APK
        run: flutter build apk --release --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Debug APK（未签名，备用）
      - name: 🏗️ 构建 Debug APK
        run: flutter build apk --debug --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ###########################################################################
  # 3️⃣ Linux 桌面
  ###########################################################################
  linux:
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: 🏗️ 构建 Linux 桌面版
        run: flutter build linux --release --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle/
          if-no-files-found: warn

  ###########################################################################
  # 4️⃣ Windows 桌面
  ###########################################################################
  windows:
    needs: [analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: 🏗️ 构建 Windows 桌面版（Release）
        run: flutter build windows --release --build-number=${{ env.BUILD_NUMBER }}
      - name: 📦 打包 VC++ 运行时 DLL
        shell: pwsh
        run: |
          $vcRedistDir = "$env:VCToolsRedistDir\x64\Microsoft.VC143.CRT"
          if (Test-Path $vcRedistDir) {
            Copy-Item "$vcRedistDir\*.dll" "build\windows\x64\runner\Release\" -Force
            Write-Host "已复制 VC++ 运行时 DLL"
          } else {
            Write-Host "未找到 VC++ 运行时目录，跳过"
          }
          Write-Host "=== 输出目录文件列表 ==="
          Get-ChildItem "build\windows\x64\runner\Release\" | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build\windows\x64\runner\Release\
          if-no-files-found: warn

  ###########################################################################
  # 5️⃣ iOS（不签名，仅模拟器）
  ###########################################################################
  ios:
    needs: [analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: 🏗️ 构建 iOS 版（不签名，仅模拟器）
        run: flutter build ios --debug --no-codesign --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug
          path: build/ios/iphonesimulator/
          if-no-files-found: warn

  ###########################################################################
  # 6️⃣ macOS 桌面
  ###########################################################################
  macos:
    needs: [analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: 🏗️ 构建 macOS 桌面版
        run: flutter build macos --release --build-number=${{ env.BUILD_NUMBER }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/
          if-no-files-found: warn
